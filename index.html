  <body>
    <canvas id="scene" aria-label="Underwater world"></canvas>
    <div id="hud" hidden></div>

    <main id="title">
      <section class="hero">
        <p class="kicker" data-i18n="title.kicker">Expedition / 10,900 metres down</p>
        <h1 aria-label="Luminara">
          <span style="--i: 0">L</span><span style="--i: 1">U</span><span style="--i: 2">M</span><span style="--i: 3">I</span><span style="--i: 4">N</span><span style="--i: 5">A</span><span style="--i: 6">R</span><span style="--i: 7">A</span>

        <nav id="main-menu" class="menu" aria-label="Main menu"></nav>

          <img src="/xpain-mark.svg" alt="" width="28" height="28" />
          <span><span data-i18n="title.madeBy">Made by</span> <b>Xpain</b></span>
        </a>
      </section>
    </main>

    <div id="pause" class="overlay" hidden>
      <div class="panel pause-panel">
        <p class="kicker" data-i18n="pause.title">Paused</p>
        <nav id="pause-menu" class="menu" aria-label="Pause menu"></nav>
      </div>
    </div>

    <div id="fatal" class="overlay" hidden>
      <div class="panel">
        <p class="kicker" data-i18n="fatal.title">WebGL 2 required</p>
        <p data-i18n="fatal.text">Your browser could not start 3D graphics. Open the game in an up-to-date Chrome, Edge, Firefox or Safari and make sure hardware acceleration is on.</p>
